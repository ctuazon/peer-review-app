name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check app/review_schema.py app/review_prompts.py app/publish.py app/cost.py app/globs.py app/eligibility.py tests || echo "::warning::ruff format differences (new modules only)"
      - run: pytest -q
